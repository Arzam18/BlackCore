name: BlackCore Android Native Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-android:
    name: BlackCore Android (aarch64)
    runs-on: ubuntu-24.04

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Android NDK Environment
      run: |
        NDKV="27.2.12479018"
        ANDROID_ROOT=/usr/local/lib/android
        ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
        SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
        
        echo "y" | $SDKMANAGER "ndk;$NDKV"
        ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
        ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        
        echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV
        echo "TOOLCHAIN_PREFIX=$ANDROID_NDK_BIN/aarch64-linux-android29-" >> $GITHUB_ENV

    - name: Locate Neural Network (corenet.bin)
      run: |
        if [ ! -f "corenet.bin" ]; then
          NET_FILE=$(find . -name "corenet.bin" | head -n 1)
          if [ -n "$NET_FILE" ]; then
            echo "Found corenet.bin at $NET_FILE. Copying to root directory..."
            cp "$NET_FILE" ./corenet.bin
          else
            echo "ERROR: corenet.bin is missing from your repository!"
            echo "You MUST upload corenet.bin to your GitHub repository for this build to work."
            exit 1
          fi
        fi

    - name: Patch Source for ARM64 & Clang
      run: |
        find . -type f -name "*.[ch]*" -exec sed -i -E 's/#include <(immintrin|nmmintrin|smmintrin|emmintrin|xmmintrin|x86intrin)\.h>//g' {} +
        find . -type f -name "*.[ch]*" -exec sed -i 's/_mm_prefetch/\\__builtin_prefetch/g' {} +
        sed -i '1i #include <sstream>' ./src/position.cpp

    - name: Compile BlackCore natively for Android
      run: |
        export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
        
        # Find C++ files
        CPP_FILES=$(find . -name "*.cpp" ! -path "*/fathom/*")
        
        # Dynamically find the tablebase C file wherever it is hiding
        TBPROBE=$(find . -name "tbprobe.c")
        
        # Removed -flto to fix the Android NDK std::ostream linker bug
        ${{ env.TOOLCHAIN_PREFIX }}clang++ \
          -O3 \
          -std=c++20 \
          -march=armv8-a \
          -pthread \
          -Wall \
          -DNDEBUG \
          -DVERSION=\"v6.0-Android\" \
          $CPP_FILES $TBPROBE \
          -o BlackCore

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlackCore-Android-ARM64
        path: BlackCore
