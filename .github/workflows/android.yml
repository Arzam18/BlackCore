name: BlackCore Android Native Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-android:
    name: BlackCore Android (aarch64)
    runs-on: ubuntu-24.04

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive  # Clones fathom/ and other submodules automatically

    - name: Set up Android NDK Environment
      run: |
        NDKV="27.2.12479018"
        ANDROID_ROOT=/usr/local/lib/android
        ANDROID_SDK_ROOT=$ANDROID_ROOT/sdk
        SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
        
        echo "y" | $SDKMANAGER "ndk;$NDKV"
        ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$NDKV
        ANDROID_NDK_BIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
        
        echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> $GITHUB_ENV
        echo "TOOLCHAIN_PREFIX=$ANDROID_NDK_BIN/aarch64-linux-android29-" >> $GITHUB_ENV

    - name: Compile BlackCore natively for Android
      run: |
        export PATH=${{ env.ANDROID_NDK_BIN }}:$PATH
        
        # Dynamically locate all .cpp files in the repository
        CPP_FILES=$(find . -name "*.cpp" ! -path "*/fathom/*")
        
        # Check if fathom tablebase file exists
        TBPROBE=""
        if [ -f "fathom/src/tbprobe.c" ]; then
          TBPROBE="fathom/src/tbprobe.c"
        fi
        
        ${{ env.TOOLCHAIN_PREFIX }}clang++ \
          -O3 \
          -flto \
          -std=c++20 \
          -march=armv8-a \
          -pthread \
          -Wall \
          -Wno-class-memaccess \
          -DNDEBUG \
          -DVERSION=\"v6.0-Android\" \
          $CPP_FILES $TBPROBE \
          -o BlackCore

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlackCore-Android-ARM64
        path: BlackCore
